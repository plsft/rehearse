# Dependabot — automatic dependency update PRs.
# Docs: https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# Commit prefixes drive release-please (see release-please-config.json):
#   fix(deps):        runtime dependency bump → patch release
#   chore(deps-dev):  devDependency bump      → no release
#   ci(deps):         Actions bump            → no release
version: 2
updates:
  # pnpm workspace (root pnpm-lock.yaml covers ts-ci, cli, site).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    # Split by dependency type so a grouped PR never mixes runtime and dev
    # bumps under one (wrong) prefix.
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]

  # Action versions in .github/workflows/. Note: most workflows are generated
  # by `rh ci compile` from .rehearse/pipelines/ — port any bump there too, or
  # the next compile will revert it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
      include: scope
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
