name: PR Title
on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
permissions:
  contents: read
jobs:
  lint-title:
    name: lint-title
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: 'actions/checkout@v7'
      - name: Setup pnpm
        uses: 'pnpm/action-setup@v6'
        with:
          version: 9.15.0
      - name: Setup Node 22
        uses: 'actions/setup-node@v7'
        with:
          node-version: '22'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint PR title
        run: 'echo "$PR_TITLE" | pnpm exec commitlint'
        env:
          PR_TITLE: '${{ github.event.pull_request.title }}'
