  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: release-please
    if: 'needs.release-please.outputs.release_created == ''true'''
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: 'actions/checkout@v7'
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: 'pnpm/action-setup@v6'
