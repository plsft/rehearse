          node-version: '22'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build all packages
        run: pnpm turbo build
      - name: 'Publish @rehearse/ci'
        run: 'pnpm --filter @rehearse/ci publish --tag latest --access public --no-git-checks'
        env:
          NODE_AUTH_TOKEN: '${{ secrets.NPM_TOKEN }}'
      - name: 'Publish @rehearse/cli'
        run: 'pnpm --filter @rehearse/cli publish --tag latest --access public --no-git-checks'
